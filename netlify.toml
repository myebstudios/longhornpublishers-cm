# Longhorn Publishers Cameroon — Netlify configuration
# See Docs/technical_architecture.md

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Deploy Previews and branch deploys build exactly like production.
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# ---------------------------------------------------------------------------
# Language routing
# ---------------------------------------------------------------------------
# Root falls back to the browser's preferred language, defaulting to English.
[[redirects]]
  from = "/"
  to = "/fr/"
  status = 302
  force = false
  conditions = { Language = ["fr"] }

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = false

# Netlify Identity must be enabled and configured as invite-only in the site
# dashboard before administrator accounts are invited.
[[redirects]]
  from = "/admin/login"
  to = "/admin/login"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin/*"
  to = "/admin/login"
  status = 302

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
